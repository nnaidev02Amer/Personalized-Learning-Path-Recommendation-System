# Alembic configuration. The database URL is NOT stored here: it comes from DATABASE_URL / .env
# (see backend/migrations/env.py). Prefer `python -m backend.app.migrate`, which adds safety checks.
[alembic]
script_location = backend/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
